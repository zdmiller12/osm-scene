[project]
name = "osm-scene"
version = "0.1.0"
description = "Transforming OpenStreetMap data."
authors = [
  {name = "zdmiller12",email = "zdmiller12@gmail.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "geopandas (>=1.0.1,<2.0.0)",
  "loguru (>=0.7.3,<0.8.0)",
  "numpy-stl (>=3.2.0,<4.0.0)",
  "pandas[computation,performance,xml] (>=2.2.3,<3.0.0)",
  "pandera (>=0.23.0,<0.24.0)",
  "pydantic-settings (>=2.8.1,<3.0.0)",
  "requests (>=2.32.3,<3.0.0)",
]


[project.scripts]
osm_scene = "osm_scene.main:main"


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"


[tool.poetry.group.dev]
optional = true


[tool.poetry.group.dev.dependencies]
pre-commit = "^4.1.0"
pytest-cov = "^6.0.0"
pytest-xdist = "^3.6.1"


[tool.poetry.group.notebook]
optional = true


[tool.poetry.group.notebook.dependencies]
ipykernel = "^6.29.5"
ipympl = "^0.9.7"
testbook = "^0.4.2"
usd-core = "^25.2.post1"


[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true


[tool.coverage.run]
branch = true
concurrency = [
  "multiprocessing",
  "thread",
]
parallel = true
relative_files = true
sigterm = true
source = ["src"]


[tool.pytest.ini_options]
addopts = "--cache-clear --cov src -n auto -vv"
log_cli = true
log_cli_level = "ERROR"
testpaths = [
  "tests",
]


[tool.ruff]
target-version = "py312"


[tool.ruff.format]
docstring-code-format = true


[tool.ruff.lint]
select = ["ALL"]


[tool.ruff.lint.extend-per-file-ignores]
"notebooks/*.ipynb" = [
  "S301",
]
"src/osm_scene/_types.py" = [
  "ANN401",
  "PLR2004",
  "S101",
]
"*test*.py" = [
  "ANN001",
  "ANN201",
  "D102",
  "D103",
  "S101",
]


[tool.ruff.lint.pydocstyle]
convention = "numpy"
